version: '3.8'
services:
  web:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - /etc/dokploy/data/everifymo/datasets:/everifymo/backend/nlp/datasets
      - /etc/dokploy/data/everifymo/assets:/everifymo/backend/nlp/assets
    env_file:
      - path: ./backend/.env
        required: false

    postgres:
      image: postgres:latest
      container_name: everifymo_database
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "5432:5432"
      volumes:
      


